name: v2 offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r wechat-ink/requirements.txt pytest
      - run: python -m pytest -q
      - run: python demo.py --no-open
